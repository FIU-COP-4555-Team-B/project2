name: PDF Build

on:
  push:
    paths:
      - doc/**/*.typ
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Typst
        run: sudo snap install typst

      - name: Typst Compile
        run: typst compile --root=. doc/main.typ project2.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: project2-pdf
          path: project2.pdf
